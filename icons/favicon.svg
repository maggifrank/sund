<ellipse cx="416" cy="228" rx="46" ry="38" fill="#0b2a3d"/>
<path d="M120 300C120 196 190 148 256 148S392 196 392 300Z" fill="#0b2a3d"/>
<path d="M112 300h288" stroke="#0b2a3d" stroke-width="24" opacity="1" stroke-linecap="round"/>
<g fill="none" stroke="#1d4a66" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
