<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source for every Sund icon: a turtle in swim goggles, half under the
       water at sunset. Full-bleed on purpose: iOS and Android cut their own
       shape out of it. The maskable build shrinks #art so the turtle stays in
       Android's safe zone. After editing, run `node bin/build-icons.mjs`. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ff9a7a"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a8fb0"/><stop offset="1" stop-color="#062a4d"/></linearGradient>
    <clipPath id="above"><rect width="512" height="272"/></clipPath>
    <clipPath id="below"><path d="M0 272c32 0 32-12 64-12s32 12 64 12 32-12 64-12 32 12 64 12 32-12 64-12 32 12 64 12 32-12 64-12 32 12 64 12V512H0z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#sky)"/>
  <path d="M0 272c32 0 32-12 64-12s32 12 64 12 32-12 64-12 32 12 64 12 32-12 64-12 32 12 64 12 32-12 64-12 32 12 64 12V512H0z" fill="url(#sea)"/>
  <g id="art">
    <circle cx="120" cy="120" r="44" fill="#fff4c9" opacity=".9"/>
    <!-- above the surface -->
    <g clip-path="url(#above)"><g transform="translate(256 272) scale(1.2) translate(-256 -272) translate(-16 0)">
<path d="M150 300q-30 6-44 34q30 4 56-20z" fill="#0b2a3d"/>
