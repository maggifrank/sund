    <!-- below it: the same turtle, pale and shifted, as if refracted -->
    <g clip-path="url(#below)" opacity=".8"><g transform="translate(8 6) skewX(-4)"><g transform="translate(256 272) scale(1.2) translate(-256 -272) translate(-16 0)">
<path d="M150 300q-30 6-44 34q30 4 56-20z" fill="#bff0ff"/>
