# Sund 2.0 on Netlify: static files only, built by bin/build-web.mjs. The
# browser talks to Supabase itself (lib/cloud.js), so there are no functions
# and no environment variables. The Supabase address and publishable key are
# public by design; the secret service_role key never goes here.
#
# web/netlify.toml says the same, so the site builds the same whether its
# base directory is left empty (this file) or set to "web" (that one).
[build]
  command = "node bin/build-web.mjs web/dist"
  publish = "web/dist"
  # Build every commit: the site is made from the whole repo.
  ignore = "exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
