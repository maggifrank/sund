<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8f4fa" media="(prefers-color-scheme: light)">
<title>Sund</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Sund">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app app--dash">

  <header class="head">
    <h1>Sund 2.0</h1>
    <div class="head-right">
      <button id="sync" class="sync" data-status="syncing" data-i18n-title="a11y.syncNow">
        <span class="dot" aria-hidden="true"></span>
        <span id="sync-text" aria-live="polite"></span>
      </button>
      <select id="lang-select" class="lang-select" data-i18n-aria="a11y.langSwitch"></select>
      <a id="map-link" class="icon-btn" href="map.html" data-i18n-title="nav.map" data-i18n-aria="nav.map">🗺</a>
      <button id="settings-toggle" class="icon-btn" aria-expanded="false" aria-controls="settings" data-i18n-title="a11y.settings">⚙</button>
    </div>
  </header>

  <section class="counter" aria-labelledby="trips-label">
    <div id="trips-label" class="label" data-i18n="counter.label"></div>
    <!-- Only with more than one card: which one the numbers below are for. -->
    <select id="card-switch" class="card-switch" data-i18n-aria="cards.switch" hidden></select>
    <div class="count-row">
      <button id="minus" class="step step--minus" data-i18n-aria="counter.remove">−</button>
      <output id="trips" class="count" aria-live="polite">0</output>
      <button id="plus" class="step step--plus" data-i18n-aria="counter.add">+</button>
    </div>
    <div id="last-swim" class="sub"></div>
    <div id="streak" class="sub" hidden></div>
    <div id="off-card" class="sub" hidden></div>
    <div id="season" class="sub" hidden></div>
    <div id="here" class="here" hidden></div>
  </section>

  <section class="hero" aria-labelledby="cpt-label">
    <div id="cpt-label" class="label" data-i18n="cost.label"></div>
    <div id="cost-per-trip" class="hero-value">—</div>
    <div id="cost-per-trip-sub" class="sub"></div>
  </section>

  <section class="card" aria-labelledby="be-label">
    <div id="be-label" class="label"></div>
    <div class="progress" role="img">
      <div id="progress-fill" class="progress-fill" style="width:0%"></div>
    </div>
    <div id="breakeven-line" class="big-line">—</div>
    <p id="breakeven-note" class="note"></p>
  </section>

  <section class="grid">
    <div class="stat">
      <div class="label" data-i18n="stat.cardPerTrip"></div>
      <div id="card-per-trip" class="stat-value">—</div>
      <div id="card-per-trip-sub" class="sub"></div>
    </div>
    <div class="stat">
      <div class="label" data-i18n="stat.delta"></div>
      <div id="delta" class="stat-value">—</div>
      <div id="delta-sub" class="sub"></div>
    </div>
  </section>

  <section class="card chart-card" aria-labelledby="chart-label">
    <div id="chart-label" class="label" data-i18n="chart.label"></div>
    <div id="chart" class="chart"></div>
  </section>

  <section class="card" aria-labelledby="weekday-label">
    <div id="weekday-label" class="label" data-i18n="weekday.label"></div>
    <div id="weekday"></div>
  </section>

  <section class="card" aria-labelledby="pools-label">
    <div id="pools-label" class="label" data-i18n="pool.label"></div>
    <div id="pool-table"></div>
  </section>

  <section class="card history">
    <button id="history-toggle" class="disclosure" aria-expanded="false" aria-controls="history-panel">
      <span class="label" data-i18n="history.label"></span>
      <span id="history-summary" class="sub"></span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <div id="history-panel" hidden>
      <form id="backdate" class="backdate">
        <label for="backdate-date" data-i18n="backdate.label"></label>
        <div class="backdate-row">
          <input id="backdate-date" name="date" type="date" required>
          <button id="backdate-add" type="submit" class="ghost-btn" data-i18n="backdate.add"></button>
        </div>
        <p id="backdate-error" class="backdate-error" hidden></p>
      </form>
      <div id="history-body"></div>
    </div>
  </section>

  <!-- A sheet rather than the last card on the page: it comes up over the
       dashboard and goes away again by being pushed back down, tapped outside
       or dismissed with Escape. <dialog> gives all three for nothing. -->
  <dialog id="settings" class="sheet" aria-labelledby="settings-title">
    <div id="settings-panel" class="sheet-panel">
      <div id="settings-grip" class="sheet-grip">
        <div class="sheet-grabber" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="settings-title" class="label" data-i18n="settings.label"></h2>
          <button id="settings-close" class="icon-btn" type="button"
                  data-i18n-title="settings.close" data-i18n-aria="settings.close">✕</button>
        </div>
      </div>

      <div class="sheet-body settings">
        <!-- Which card the fields below are for. Each card has its own price,
             dates and pools; the counter shows the one picked here. -->
        <div class="settings-cards">
          <label><span data-i18n="cards.label"></span>
            <select id="card-select"></select>
          </label>
          <label><span data-i18n="cards.name"></span>
            <input id="in-card-name" type="text" maxlength="40" autocomplete="off">
          </label>
          <div class="settings-actions">
            <button id="card-add" class="ghost-btn" type="button" data-i18n="cards.add"></button>
            <button id="card-delete" class="danger-btn" type="button" data-i18n="cards.delete"></button>
          </div>
        </div>
        <label><span data-i18n="settings.membership"></span>
          <input id="in-membership" type="number" min="0" step="100" inputmode="numeric">
        </label>
        <div class="settings-pair">
          <label><span data-i18n="settings.seasonStart"></span>
            <input id="in-season-start" type="date">
          </label>
          <label><span data-i18n="settings.seasonEnd"></span>
            <input id="in-season-end" type="date">
          </label>
        </div>
        <p id="season-warning" class="settings-warning" hidden></p>

        <div class="settings-pools">
          <div class="settings-pools-head">
            <span data-i18n="settings.cardPools"></span>
            <span id="card-pools-count" class="settings-pools-count"></span>
          </div>
          <input id="pool-filter" type="search" autocomplete="off"
                 data-i18n-placeholder="settings.poolFilter"
                 data-i18n-aria="settings.poolFilter">
          <div id="card-pool-list" class="pool-picker"></div>
          <p id="pool-no-match" class="settings-warning" hidden></p>
        </div>
        <label><span data-i18n="settings.cardPrice"></span>
          <input id="in-card-price" type="number" min="0" step="100" inputmode="numeric">
        </label>
        <label><span data-i18n="settings.cardTrips"></span>
          <input id="in-card-trips" type="number" min="1" step="1" inputmode="numeric">
        </label>
        <!-- Sund 2.0 only: lib/account.js shows it when the app is signed in to
             Supabase. On serve.js there is no account to show. -->
        <section id="account" class="settings-account" hidden>
          <h3 class="label" data-i18n="account.label"></h3>
          <p id="account-email" class="note"></p>
          <form id="account-username" class="row">
            <label><span data-i18n="account.username"></span>
              <input id="in-username" type="text" required minlength="3" maxlength="30"
                     pattern="[a-z0-9]+(-[a-z0-9]+)*" autocapitalize="none" spellcheck="false">
            </label>
            <button type="submit" class="ghost-btn" data-i18n="account.save"></button>
          </form>
          <label class="check-row"><input id="in-public" type="checkbox">
            <span data-i18n="account.public"></span>
          </label>
          <p class="note"><a id="account-page" target="_blank" rel="noopener"></a></p>
          <label id="account-import" class="ghost-btn file-btn"><span data-i18n="account.import"></span>
            <input id="in-import" type="file" accept="application/json,.json" hidden>
          </label>
          <p id="account-status" class="note" role="status" hidden></p>
          <p id="account-admin" class="note" hidden><a href="/admin/" data-i18n="account.admin"></a></p>
          <div class="settings-actions">
            <button id="sign-out" class="ghost-btn" type="button" data-i18n="account.signOut"></button>
            <button id="delete-account" class="danger-btn" type="button" data-i18n="account.delete"></button>
          </div>
        </section>

        <div class="settings-actions">
          <button id="export" class="ghost-btn" type="button" data-i18n="settings.export"></button>
          <button id="reset" class="danger-btn" type="button" data-i18n="settings.reset"></button>
        </div>
        <p class="note" data-i18n="settings.note"></p>
      </div>
    </div>
  </dialog>

  <p id="rate-note" class="rate-note" hidden></p>

</main>
<script type="module" src="app.js"></script>
</body>
</html>
