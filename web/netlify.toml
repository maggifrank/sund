# Sund 2.0 on Netlify, for a site whose base directory is "web". The
# netlify.toml at the repo root is the same build for a site with no base
# directory; keep the two in step.
#
# Static files only: the browser talks to Supabase itself (lib/cloud.js), so
# there are no functions. No environment variables are needed either; the
# Supabase address and publishable key are public by design and live in
# lib/cloud.js. The secret service_role key never goes here.
[build]
  command = "cd .. && node bin/build-web.mjs web/dist"
  publish = "dist"
  # Netlify skips a build when nothing under the base directory changed, but
  # the site is built from the whole repo (lib/, public/, the app). Always build.
  ignore = "exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
