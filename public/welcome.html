<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8f4fa" media="(prefers-color-scheme: light)">
<title>Sund</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Sund">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The first visit after signing up: a username, then the card, then whether
     the page is public. Only the username is needed; the rest can be skipped
     and changed later under ⚙. -->
<main class="app app--login">

  <header class="head">
    <h1 data-i18n="welcome.title"></h1>
    <div class="head-right">
      <select id="lang-select" class="lang-select" data-i18n-aria="a11y.langSwitch"></select>
    </div>
  </header>

  <form id="step-1" class="card login-card settings" data-step="1">
    <p id="step-label-1" class="note step-label"></p>
    <p id="username-lead" class="home-lead"></p>
    <label><span data-i18n="welcome.username"></span>
      <input id="in-username" type="text" required minlength="3" maxlength="30"
             pattern="[a-z0-9]+(-[a-z0-9]+)*" autocapitalize="none" autocomplete="username" spellcheck="false">
    </label>
    <p class="note" data-i18n="welcome.usernameRules"></p>
    <p class="settings-warning" role="alert" hidden></p>
    <div class="settings-actions">
      <button type="submit" class="primary-btn" data-i18n="welcome.next"></button>
    </div>
  </form>

  <form id="step-2" class="card login-card settings" data-step="2" hidden>
    <p id="step-label-2" class="note step-label"></p>
    <p class="home-lead" data-i18n="welcome.cardLead"></p>
    <label><span data-i18n="settings.membership"></span>
      <input id="in-membership" type="number" min="0" step="100" inputmode="numeric" required>
    </label>
    <div class="settings-pair">
      <label><span data-i18n="settings.seasonStart"></span>
        <input id="in-season-start" type="date">
      </label>
      <label><span data-i18n="settings.seasonEnd"></span>
        <input id="in-season-end" type="date">
      </label>
    </div>
    <label><span data-i18n="settings.cardPrice"></span>
      <input id="in-card-price" type="number" min="0" step="100" inputmode="numeric" required>
    </label>
    <label><span data-i18n="settings.cardTrips"></span>
      <input id="in-card-trips" type="number" min="1" step="1" inputmode="numeric" required>
    </label>
    <p class="note" data-i18n="welcome.cardPoolsNote"></p>
    <p class="settings-warning" role="alert" hidden></p>
    <div class="settings-actions">
      <button type="button" class="ghost-btn" data-skip data-i18n="welcome.skip"></button>
      <button type="submit" class="primary-btn" data-i18n="welcome.next"></button>
    </div>
  </form>

  <form id="step-3" class="card login-card settings" data-step="3" hidden>
    <p id="step-label-3" class="note step-label"></p>
    <p class="home-lead" data-i18n="welcome.publicLead"></p>
    <label class="check-row"><input id="in-public" type="checkbox">
      <span id="public-label"></span>
    </label>
    <p class="settings-warning" role="alert" hidden></p>
    <div class="settings-actions">
      <button type="submit" class="primary-btn" data-i18n="welcome.done"></button>
    </div>
  </form>

</main>
<script type="module" src="welcome.js"></script>
</body>
</html>
